<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Rosary — Example RSS Feed sample</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" />
  
  <style>
    /* Apple Help Documentation Theme Colors & Typography */
    :root {
      --bg-color: #ffffff;
      --text-color: #1d1d1f;
      --heading-color: #000000;
      --link-color: #0066cc;
      --code-bg: #f5f5f7;
      --code-border: #d2d2d7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.47059;
      font-weight: 400;
      letter-spacing: -.022em;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .wrapper {
      max-width: 780px;
      width: 100%;
    }

    h1 {
      font-size: 32px;
      line-height: 1.125;
      font-weight: 700;
      letter-spacing: .004em;
      color: var(--heading-color);
      margin-top: 0;
      margin-bottom: 12px;
    }

    p {
      font-size: 17px;
      line-height: 1.47059;
      font-weight: 400;
      letter-spacing: -.022em;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .code-container {
      position: relative;
      background-color: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 8px;
      margin-top: 24px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #e8e8ed;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #6e6e73;
      border-bottom: 1px solid var(--code-border);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--link-color);
      cursor: pointer;
      font-weight: 500;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .copy-btn:hover {
      background-color: rgba(0, 102, 204, 0.1);
    }

    /* Target block wrapper formatting */
    pre[class*="language-"] {
      margin: 0 !important;
      padding: 16px !important;
      background: transparent !important;
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
      /* Soft wraps lines and forces bottom scrollbars away */
      white-space: pre-wrap !important;       
      word-wrap: break-word !important;       
      word-break: break-word !important;       
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <h1>Example RSS Feed sample</h1>
    <p>Review this example of a well-formed RSS feed containing your custom app metadata and beta testing properties. You can copy the code snippet below to construct your own XML structure.</p>

    <div class="code-container">
      <div class="code-header">
        <span>xml</span>
        <button class="copy-btn" onclick="copyCode()">Copy Code</button>
      </div>
      <pre><code id="xml-code" class="language-xml"></code></pre>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>

  <script>
    // Exact raw XML feed content
    const rawXml = `<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0"
     xmlns:app="https://apphub.dev/rss/app"
     xmlns:dev="https://apphub.dev/rss/developer"
     xmlns:social="https://apphub.dev/rss/social">

  <channel>
    <title>Daily Rosary — App Test Feed</title>
    <link>https://dailyrosary.cf/</link>
    <description>Beta testing information for the Daily Rosary app.</description>
    <language>en</language>
    <lastBuildDate>Sat, 16 May 2026 09:00:00 EST</lastBuildDate>

    <dev:developer>
      <dev:name>Eric Kouassi</dev:name>
      <dev:email>hello@erickouassi.com</dev:email>
      <dev:website>https://dailyrosary.cf/</dev:website>

      <social:links>
        <social:reddit>https://reddit.com/r/dailyrosary</social:reddit>
        <social:facebook>https://facebook.com/dailyrosary</social:facebook>
        <social:github>https://github.com/XP-DEVOTION</social:github>
        <social:discord>https://discord.gg/dailyrosary</social:discord>
        <social:twitter>https://twitter.com/dailyrosary</social:twitter>
        <social:youtube>https://youtube.com/@dailyrosary</social:youtube>
      </social:links>
    </dev:developer>

    <item>
      <title>Daily Rosary</title>
      <guid isPermaLink="false">com.erickouassi.dailyrosary</guid>

      <pubDate>Fri, 15 May 2026 09:00:00 -0500</pubDate>

      <app:platform>Android</app:platform>
      <app:version>1.0.0</app:version>

      <app:status>open-testing</app:status>

      <app:testingDuration>25</app:testingDuration>

      <app:testLink>https://play.google.com/apps/testing/com.erickouassi.dailyrosary</app:testLink>
      <app:groupLink>https://groups.google.com/g/daily-rosary-beta-testers</app:groupLink>

      <app:groupMembers>40</app:groupMembers>

      <description>
        A peaceful Rosary prayer app seeking Android testers for a 14‑day install requirement.
      </description>

      <app:requirements>
        <app:requirement>Android phone</app:requirement>
        <app:requirement>Google account</app:requirement>
        <app:requirement>Keep installed 14 days +</app:requirement>
      </app:requirements>

      <app:languages>
        <app:language>English</app:language>
        <app:language>French</app:language>
      </app:languages>

      <app:countries>
        <app:country>United States</app:country>
        <app:country>Canada</app:country>
        <app:country>France</app:country>
      </app:countries>

    </item>
     
  </channel>
</rss>`;

    // Insert text via textContent to securely escape characters automatically
    const codeElement = document.getElementById('xml-code');
    codeElement.textContent = rawXml;

    // Trigger Prism engine to highlight the safe elements
    Prism.highlightElement(codeElement);

    // Clipboard Copy Functionality
    function copyCode() {
      navigator.clipboard.writeText(rawXml).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy Code'; }, 2000);
      });
    }
  </script>
</body>
</html>
