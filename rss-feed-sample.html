
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Rosary — Example RSS Feed</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" />
  
  <style>
    /* Clean & Simple Documentation Typography */
    :root {
      --bg-color: #ffffff;
      --text-color: #1d1d1f;
      --heading-color: #000000;
      --link-color: #0066cc;
      --code-bg: #f5f5f7;
      --code-border: #d2d2d7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--heading-color);
      margin-bottom: 8px;
    }

    p {
      margin-bottom: 24px;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .copy-btn {
      background: none;
      border: 1px solid var(--code-border);
      padding: 4px 12px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
    }

    .copy-btn:hover {
      background-color: var(--code-bg);
    }

    pre[class*="language-"] {
      background: var(--code-bg) !important;
      border: 1px solid var(--code-border);
      border-radius: 8px;
      padding: 16px !important;
      margin: 0 !important;
    }

    code[class*="language-"] {
      color: var(--text-color) !important;
      font-family: SFMono-Regular, Consolas, Monaco, monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Example RSS Feed Sample</h1>
  <a href="index.html" class="back-link">← Back to Dashboard</a>
  <p>
    This sample shows how to format your remote channel feed for index matching. 
    Review the <a href="developer-guidelines.html">Developer Guidelines</a> to learn more.
  </p>

  <div class="code-header">
    <strong>feed-sample.xml</strong>
    <button class="copy-btn" onclick="copyCode(this)">Copy Snippet</button>
  </div>
  <pre><code id="xml-code" class="language-xml"></code></pre>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

<script>
  // Raw RSS Data string to copy and escape cleanly
  const rawXml = `<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0"
     xmlns:app="https://apphub.dev/rss/app"
     xmlns:dev="https://apphub.dev/rss/developer"
     xmlns:social="https://apphub.dev/rss/social">

  <channel>
    <title>Daily Rosary — App Test Feed</title>
    <link>https://dailyrosary.cf/</link>
    <description>Beta testing information for the Daily Rosary app.</description>
    <language>en</language>
    <lastBuildDate>Sat, 16 May 2026 09:00:00 EST</lastBuildDate>

    <dev:developer>
      <dev:name>Eric Kouassi</dev:name>
      <dev:email>hello@erickouassi.com</dev:email>
      <dev:website>https://dailyrosary.cf/</dev:website>

      <social:links>
        <social:reddit>https://reddit.com/r/dailyrosary</social:reddit>
        <social:facebook>https://facebook.com/dailyrosary</social:facebook>
        <social:github>https://github.com/XP-DEVOTION</social:github>
        <social:discord>https://discord.gg/dailyrosary</social:discord>
        <social:twitter>https://twitter.com/dailyrosary</social:twitter>
        <social:youtube>https://youtube.com/@dailyrosary</social:youtube>
      </social:links>
    </dev:developer>

    <item>
      <title>Daily Rosary</title>
      <guid isPermaLink="false">com.erickouassi.dailyrosary</guid>
      <pubDate>Fri, 15 May 2026 09:00:00 -0500</pubDate>

      <app:platform>Android</app:platform>
      <app:version>1.0.0</app:version>
      <app:status>open-testing</app:status>
      <app:testingDuration>25</app:testingDuration>

      <app:testLink>https://play.google.com/apps/testing/com.erickouassi.dailyrosary</app:testLink>
      <app:groupLink>https://groups.google.com/g/daily-rosary-beta-testers</app:groupLink>
      <app:groupMembers>40</app:groupMembers>

      <description>
        A peaceful Rosary prayer app seeking Android testers for a 14‑day install requirement.
      </description>

      <app:requirements>
        <app:requirement>Android phone</app:requirement>
        <app:requirement>Google account</app:requirement>
        <app:requirement>Keep installed 14 days +</app:requirement>
      </app:requirements>

      <app:languages>
        <app:language>English</app:language>
        <app:language>French</app:language>
      </app:languages>

      <app:countries>
        <app:country>United States</app:country>
        <app:country>Canada</app:country>
        <app:country>France</app:country>
      </app:countries>

      <app:category>Lifestyle</app:category>
      <app:price>Free</app:price>
      <app:icon>https://raw.githubusercontent.com/XP-DEVOTION/playlist-Daily-Rosary/main/assets/icon.png</app:icon>
   

    </item>
        
    <item>
      <title>Le Rosaire du Jour</title>
      <guid isPermaLink="false">com.erickouassi.lerosaire</guid>
      <pubDate>Fri, 15 May 2026 09:00:00 -0500</pubDate>

      <app:platform>Android</app:platform>
      <app:version>1.0.0</app:version>
      <app:status>open-testing</app:status>
      <app:testingDuration>25</app:testingDuration>

      <app:testLink>https://play.google.com/apps/testing/com.erickouassi.lerosaire.dailyrosary</app:testLink>
      <app:groupLink>https://groups.google.com/g/le-rosaire-du-jour-beta-testers</app:groupLink>
      <app:groupMembers>40</app:groupMembers>

      <description>
        Version française du Rosaire quotidien, avec audio, mystère du jour automatique et suivi de prière.
      </description>

      <app:requirements>
        <app:requirement>Connexion Internet</app:requirement>
        <app:requirement>Navigateur moderne</app:requirement>
      </app:requirements>

      <app:languages>
        <app:language>French</app:language>
      </app:languages>

      <app:countries>
        <app:country>Cote D'Ivoire</app:country>
        <app:country>France</app:country>
        <app:country>Canada</app:country>
        <app:country>United States</app:country>
      </app:countries>

      <app:category>Lifestyle</app:category>
      <app:price>Free</app:price>
      <app:icon>https://raw.githubusercontent.com/XP-DEVOTION/playlist-Daily-Rosary/main/assets/icon.png</app:icon>
    </item>

  </channel>
</rss>`;

  // Insert text via textContent to securely escape HTML characters
  const codeElement = document.getElementById('xml-code');
  codeElement.textContent = rawXml;

  // Trigger Prism highlighting pass
  Prism.highlightElement(codeElement);

  // Clipboard handler logic
  function copyCode(button) {
    navigator.clipboard.writeText(rawXml).then(() => {
      button.textContent = "Copied!";
      setTimeout(() => {
        button.textContent = "Copy Snippet";
      }, 2000);
    });
  }
</script>
</body>
</html>
