<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>App Testing Hub</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; }
    .app { padding: 12px; margin-bottom: 10px; background: #222; border-radius: 8px; }
    .title { font-size: 1.1rem; font-weight: bold; }
    .meta { font-size: 0.85rem; color: #aaa; }
  </style>
</head>
<body>

<h1>App Testing Hub</h1>
<div id="apps">Loading…</div>

<script>
async function loadApps() {
  const API_BASE =
    location.hostname === "127.0.0.1" || location.hostname === "localhost"
      ? "https://app-testing-hub.vercel.app"
      : "";

  const res = await fetch(`${API_BASE}/api/apps`);
  const data = await res.json();

  const container = document.getElementById("apps");
  container.innerHTML = "";

  data.apps.forEach(app => {
    const div = document.createElement("div");
    div.className = "app";
    div.innerHTML = `
      <div class="title">${app.title}</div>
      <div class="meta">${app.platform} • ${app.version}</div>
      <div>${app.description}</div>
    `;
    container.appendChild(div);
  });
}

loadApps();
</script>

</body>
</html>
