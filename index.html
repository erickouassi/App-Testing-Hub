<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>App Testing Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div>
        <div class="logo">App Testing Hub</div>
        <div class="subtitle">Curated Google Closed Testing campaigns</div>
      </div>
      <div class="header-meta">
        <span id="last-updated">Last updated: —</span>
        <button id="refresh-btn" class="btn btn-primary">🔄 Refresh apps</button>
      </div>
    </div>
  </header>

  <main class="main">
    <aside class="filters">
      <div class="filters-title">
        Filters <span id="apps-count-label">(0 apps)</span>
      </div>

      <div class="filter-group">
        <div class="filter-label">Platform</div>
        <div class="filter-chips" id="platform-filters">
          <button class="filter-chip active" data-platform="all">All</button>
          <button class="filter-chip" data-platform="Android">Android</button>
          <button class="filter-chip" data-platform="iOS">iOS</button>
          <button class="filter-chip" data-platform="Web">Web</button>
        </div>
      </div>
    </aside>

    <section>
      <div id="apps-loading" class="loading">Loading apps…</div>
      <div id="apps-empty" class="empty hidden">No apps found for this filter.</div>
      <div id="apps-container" class="apps-container"></div>
    </section>
  </main>

  <footer class="footer">
    Built for Google Closed Testing • App Testing Hub
  </footer>

  <!-- Details modal -->
  <div id="details-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
